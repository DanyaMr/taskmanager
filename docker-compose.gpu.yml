version: '3.8'

services:
  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: taskmanager
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./department/database:/app/department/database
      - ./department/rag/vector_db:/app/department/rag/vector_db
    environment:
      - PYTHONUNBUFFERED=1
    # Доступ к хосту для LM Studio (localhost:1234)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped